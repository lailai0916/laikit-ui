name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - uses: actions/checkout@v7
        with:
          repository: lailai0916/lailai-template
          ref: 44bf94b5718ba605cdd7e240ed2e47b4b53f7500
          path: .repository-standards
          persist-credentials: false
      - name: Validate repository standards
        run: python3 scripts/validate-standards.py .repository-standards/scripts/check_repository.py
